import groovy.json.JsonSlurper

plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
}

def rootProperties = new Properties()
file('../../gradle.properties').withInputStream { rootProperties.load(it) }
def pomMetadata = new JsonSlurper().parse(file('../../pom.json'))

group = 'net.hasor'
version = rootProperties.getProperty('version')

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
    withJavadocJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = false
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${rootProperties.getProperty('lib.junit')}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

jacoco {
    toolVersion = rootProperties.getProperty('lib.jacoco')
}
tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
}
tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')
}

gradlePlugin {
    plugins {
        hasorBoot {
            id = 'net.hasor.boot'
            implementationClass = 'net.hasor.boot.gradle.HasorBootGradlePlugin'
        }
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Hasor-Boot-Gradle-Plugin'
            description = 'Hasor Boot Gradle packaging plugin.'
            url = pomMetadata.url
            licenses {
                pomMetadata.licenses.each { licenseMetadata ->
                    license {
                        name = licenseMetadata.name
                        url = licenseMetadata.url
                    }
                }
            }
            developers {
                pomMetadata.developers.each { developerMetadata ->
                    developer {
                        name = developerMetadata.name
                        email = developerMetadata.email
                    }
                }
            }
            scm {
                connection = pomMetadata.scm.connection
                developerConnection = pomMetadata.scm.developerConnection
                url = pomMetadata.scm.url
                tag = pomMetadata.scm.tag
            }
        }
    }
    if (findProperty('centralBundleDir')) {
        repositories {
            maven {
                name = 'centralBundle'
                url = uri(findProperty('centralBundleDir'))
            }
        }
    }
}

signing {
    required { findProperty('centralRelease') == 'true' }
    def signingKey = findProperty('maven.central.signing_key')
    def signingPassword = findProperty('maven.central.signing_password')
    if (signingKey) {
        useInMemoryPgpKeys(signingKey.replace('\\n', '\n'), signingPassword)
    }
    sign publishing.publications
}
