plugins {
    id 'application'
    id 'net.hasor.boot'
}

configurations {
    bootLoader
}

dependencies {
    implementation "net.hasor:hasor-boot:${property('lib.hasor')}"
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.30'
    bootLoader "net.hasor:hasor-boot-loader:${property('lib.hasor')}"
}

application {
    mainClass = 'net.hasor.demo.boot.DemoHasorBootApplication'
}

tasks.named('bootJar') {
    mainClass.set(application.mainClass)
    loaderClasspath.from(configurations.bootLoader)
}
